<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body >
    
    <div class="Projects">
    <!-- 1. tasbih counter -->
  <section class="project">
    <h2>tasbih counter</h2>
    <p id="display">0</p>
  
        <button id="decrease">-</button>
        <button id="reset">Reset</button>
        <button id="increase">+</button>
</section>

</section>
    <!-- 2. password show -->
 <section class="project">
        <h1>Show / Hide Password</h1>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
        >

        <button id="toggleBtn">Show Password</button>
    </section>

    <!-- 3.Character Counter -->
     <section class="project">
        <h1 id="h3">Character Counter</h1>

        <textarea
            id="textInput"
            placeholder="Start typing..."
        ></textarea>

        <p id="counting">Characters: 0</p>
    </section>

<!-- 4. Dark Mode Toggle -->
<section class="project">

    <h1 id="h4">Dark Mode Toggle</h1>

    <p id="mode">Current Mode: Light</p>

    <button id="themeBtn">
        Dark Mode
    </button>

</section>

<!-- 5. Random Color Generator -->
<section class="project">

    <h1>Random Color Generator</h1>

    <div id="colorBox"></div>

    <p id="colorCode">
        rgb(255, 255, 255)
    </p>

    <button id="generateBtn">
        Generate Color
    </button>

</section>

<!-- 6. Age Calculator -->
<section class="project">

    <h1>Age Calculator</h1>

    <input
        type="date"
        id="birthDate"
    >

    <button id="calculateBtn">
        Calculate Age
    </button>

    <p id="ageResult">
        Your Age: -
    </p>

</section>

<!-- x. Number Guessing Game -->
<section class="project">

    <h1>Number Guessing Game</h1>

    <p>Guess a number between 1 and 10.</p>

    <input type="number" id="guess" placeholder="Enter your guess">

    <button id="checkBtn">Check</button>

    <button id="resetBtn">Reset</button>

    <p id="result">Result will appear here.</p>

    <p id="score">Score: 10</p>
</div>

    <script src="ass.js"></script>

</body>
</html>
